<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // iPhones zoom the page in when a text box under 16px is tapped. maximum-scale=1 stops that,
      // and on iPhone pinch-to-zoom still works (Safari ignores it for pinching). It's iPhone/iPad only,
      // because on Android it would block pinch-to-zoom, and Android doesn't zoom on tap anyway.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name="viewport"]').content += ", maximum-scale=1";
      }
    </script>
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" href="/favicon.ico?v=13" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=13" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Batter Beats</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
