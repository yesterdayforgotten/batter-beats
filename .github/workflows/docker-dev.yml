# Builds the development container image (Dockerfile.dev) when it changes and
# publishes it as ghcr.io/<owner>/batter-beats-dev.
name: Dev container image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.dev
      - scripts/dev-container-start.sh
      - .github/workflows/docker-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-dev:latest
            ghcr.io/${{ github.repository }}-dev:sha-${{ github.sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
