# Builds the Chatterbox voice engine (github.com/travisvn/chatterbox-tts-api,
# AGPL-3.0) from a fixed version and publishes it as
# ghcr.io/<owner>/chatterbox-tts-api:cpu, so the stack can pull a ready image.
# Batter Beats only talks to it over HTTP; its source is at the link above.
name: Chatterbox voice engine image

on:
  push:
    branches: [main]
    paths: [.github/workflows/chatterbox.yml]
  workflow_dispatch:

env:
  UPSTREAM: travisvn/chatterbox-tts-api
  # The version built. Change it deliberately, after checking the project's changes.
  UPSTREAM_SHA: a5f466128e4baa8e4cceb3bba9b7ca9de6f7ec6b

permissions:
  contents: read
  packages: write

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.UPSTREAM_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatterbox-tts-api:cpu
            ghcr.io/${{ github.repository_owner }}/chatterbox-tts-api:cpu-${{ env.UPSTREAM_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.description=Chatterbox TTS API (CPU), built unchanged from github.com/${{ env.UPSTREAM }} for Batter Beats
          cache-from: type=gha,scope=chatterbox-cpu
          cache-to: type=gha,scope=chatterbox-cpu,mode=max
