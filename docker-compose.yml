# Batter Beats production stack. In Portainer: Stacks → Add stack → paste this.
# Change the published port if 8090 is taken, and set an admin password
# (only used the first time, to create the first admin account).
services:
  batter-beats:
    image: ghcr.io/yesterdayforgotten/batter-beats:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
      # Proxies on the local network (such as Apache) are trusted for https detection.
      TRUST_PROXY: loopback, linklocal, uniquelocal
      # The announcer's voice engine (the service below).
      TTS_URL: http://kokoro:8880
    volumes:
      # Everything the app stores: database, songs, clips. Updating the image never touches it.
      - batter-beats-data:/data

  # Announcer voice engine (Kokoro, open source, runs on an ordinary CPU).
  # Batter Beats asks it to speak each announcement once and stores the result,
  # so it is only busy when names or wording change.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped

volumes:
  batter-beats-data:
