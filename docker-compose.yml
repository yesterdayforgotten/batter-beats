# Batter Beats production stack. In Portainer: Stacks → Add stack → paste this.
# Change the published port if 8090 is taken, and set an admin password
# (only used the first time, to create the first admin account).
services:
  batter-beats:
    image: ghcr.io/yesterdayforgotten/batter-beats:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
      # Proxies on the local network (such as Apache) are trusted for https detection.
      TRUST_PROXY: loopback, linklocal, uniquelocal
      # The announcer's voice engine (the service below).
      TTS_ENGINE: chatterbox
      TTS_URL: http://chatterbox:4123
      # Optional: Murf's paid cloud voices as a second engine, switchable under Admin.
      # Paste your Murf API key here (never commit it anywhere).
      # MURF_API_KEY: ""
      # Optional: ElevenLabs' paid cloud voices as another engine (key needs the
      # Text to Speech and Voices permissions).
      # ELEVENLABS_API_KEY: ""
    volumes:
      # Everything the app stores: database, songs, clips. Updating the image never touches it.
      - batter-beats-data:/data

  # Announcer voice engine: Chatterbox (github.com/travisvn/chatterbox-tts-api).
  # It has an emotion dial and learns voices from a recording. It is meant for a
  # graphics card; this CPU version works, slowly (announcements are made once
  # and stored, so that's acceptable). It needs 4–8 GB of memory and downloads
  # its voice model (a few GB) on first start.
  chatterbox:
    image: ghcr.io/yesterdayforgotten/chatterbox-tts-api:cpu
    restart: unless-stopped
    environment:
      DEVICE: cpu
      # The original English model. The default multilingual one failed to
      # speak on a CPU ("TTS generation failed" for every request).
      USE_MULTILINGUAL_MODEL: "false"
    volumes:
      - chatterbox-models:/cache
      - chatterbox-voices:/voices

volumes:
  batter-beats-data:
  chatterbox-models:
  chatterbox-voices:
